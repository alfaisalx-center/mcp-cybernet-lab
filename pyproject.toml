[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpnet"
version = "0.1.0"
description = "Containerised MCP network testbeds generated from one YAML file"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcpnet = "mcpnet.cli:main"

[tool.setuptools]
packages = ["mcpnet"]
