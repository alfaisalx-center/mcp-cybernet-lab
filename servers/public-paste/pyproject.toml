[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcl-public-paste"
version = "0.1.0"
description = "Public paste site: an observable public sink (MCP CyberNet Lab)"
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0"]

[project.scripts]
mcl-public-paste = "public_paste.server:main"

[tool.setuptools]
packages = ["public_paste"]
