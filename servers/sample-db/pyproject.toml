[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcl-sample-db"
version = "0.1.0"
description = "Sample MCP server exposing a synthetic company database, read-only (MCP CyberNet Lab)"
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0"]

[project.scripts]
mcl-sample-db = "sample_db.server:main"

[tool.setuptools]
packages = ["sample_db"]

[tool.setuptools.package-data]
sample_db = ["seed.sql"]
